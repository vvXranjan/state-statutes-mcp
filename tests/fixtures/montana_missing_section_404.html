		:root {
			/* Dark */
			--color1: #28282a;
			--color1-rgb: 40, 40, 42;
			/* Medium - Gray */
			--color2: #565859;
			--color2-rgb: 86, 88, 89;
			/* Bright - Secondary */

			--color3-rgb: 103, 137, 127;

			--color4-rgb: 197, 207, 206;
			/* Light - Vanilla */
			--color5: #FAF6EA;
			--color5-rgb: 250, 246, 234;
			/* Accent 1 - Tertiary */
			--color6: #8a5f68;
			--color6-rgb: 138, 95, 104;
			--color6-txt: #c08f99;
			/* Accent 2 - Accent 2 */
			--color7: #77aaaf;
			--color7-rgb: 119, 170, 175;
			/* Link - Accent 1 */
			--link: #4ea0a7;
			--link-hover: #296b70;
			/* Btn Primary */
			--primary: #67897f;
			--primary-rgb: 103, 137, 127;

			background: var(--color1);

			background: var(--color9);

		body {
			background: radial-gradient(ellipse at bottom, #5B5B5D 0%, var(--color1) 100%);
			font-family: "open-sans", serif;
			color: #3d3d40;
			overflow: hidden;
		}

		h1 {
			font-size: 10vw;
			font-weight: bold;
			text-transform: uppercase;
			color: white;
		}

		h2 {
			color: white;
		}

		a:not(.btn):not(.nav-link):not(.dropdown-item),
		.btn-link,
		.nav-tabs .nav-link {
			color: var(--link);
			text-decoration: none;
		}

		a:not(.btn):not(.nav-link):not(.dropdown-item):focus,
		.nav-tabs .nav-link .btn-link:focus,
		a:not(.btn):not(.nav-link):not(.dropdown-item):hover,
		.btn-link:hover {
			color: var(--link-hover);
			text-decoration: underline;
		}

		.logo,
		.logo a,
		.logo img {
			width: 130px;
			transition: left .3s ease-out, top .3s ease-out, width .3s ease-out, height .3s ease-out, transform 5s ease-out .3s;
		}

		.logo a {
			position: absolute;
			top: -32px;
			margin: 0 auto;
			z-index: 99;
		}

		#topNav {
			height: 30px;
		}

		#bottomHeader {
			height: 60px;
		}

		main>.container {
			position: relative;
			padding: 150px 0 0 0;
			z-index: 4;
		}

		.heading {
			position: relative;
			font-size: 9em;
			line-height: 1;
			text-shadow: 0 0 1rem #fefefe;
			animation: float 3s infinite;
		}

		#shadow {
			margin: 0 auto;
			background: var(--color1);
			width: 150px;
			height: 15px;
			border-radius: 50%;
			animation: zoom 3s infinite;
		}

		/********************************** BUTTONS **********************************/
		.btn-primary {
			color: white;
			background-color: var(--primary);
			border-color: var(--primary);
		}

		.btn-primary.disabled,
		.btn-primary:disabled {
			color: white;
			background-color: var(--primary2);
			border-color: var(--primary2);
		}

		.btn-primary:hover,
		.btn-primary.focus,
		.btn-primary:focus,
		.btn-primary:not(:disabled):not(.disabled).active,
		.btn-primary:not(:disabled):not(.disabled):active {
			color: white;
			background-color: var(--primary3);
			border-color: var(--primary3);
		}

		.btn-primary.focus,
		.btn-primary:focus,
		.btn-primary:not(:disabled):not(.disabled).active:focus,
		.btn-primary:not(:disabled):not(.disabled):active:focus {
			box-shadow: 0 0 0 0.2rem rgba(var(--primary-rgb), 0.5);
		}

		/********************************** SOCIAL **********************************/
		footer {
			z-index: 3;
		}

		footer .nav-link {
			padding: 10px;
			font-size: 12px;
		}

		ul.social li a {
			width: 30px;
			height: 30px;
			text-align: center;
			line-height: 30px;
			font-size: 20px;
			margin: 0 10px;
			padding: 0;
			display: block;
			border-radius: 50%;
			position: relative;
			overflow: hidden;
			z-index: 1;
			text-align: center;
		}

		ul.social li a .icon {
			position: relative;
			color: white;
			transition: .5s;
			z-index: 3;
		}

		ul.social li a:hover .icon {
			color: #fff;
			transform: rotateY(360deg);
		}

		ul.social li a:before {
			content: "";
			position: absolute;
			top: 100%;
			left: 0;
			width: 100%;
			height: 100%;
			background: #f00;
			transition: .5s;
			z-index: 2;
		}

		ul.social li a:hover:before {
			top: 0;
		}

		ul.social li:nth-child(1) a:before {
			background: #3b5999;
		}

		ul.social li:nth-child(2) a:before {
			background: #55acee;
		}

		ul.social li:nth-child(3) a:before {
			background: #0077b5;
		}

		ul.social li:nth-child(4) a:before {
			background: #dd4b39;
		}
