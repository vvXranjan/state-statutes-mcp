<script>
    $(document).ready(function () {
        initJsTree('/Laws/GeneralLaws/GetJsTree', 'V', '');

        accordionAjaxLoad('5', '0', '');

        var anchor = document.getElementById('' + 'title');
        if(anchor != null){
            anchor.scrollIntoView(true);
        }
    });

    function accordionAjaxLoad(partId, titleId, titleCode) {
        var elementsToReplace = '#title' + titleCode;

        $('.fnRemoveClick' + titleId).attr('onclick', '');

        var url = '/Laws/GeneralLaws/GetChaptersForTitle';

        var params = {
            "partId": partId,
            "titleId": titleId,
            "code": titleCode
        }
        url += '?' + $.param(params, false);

        ExecuteAction(this, elementsToReplace, url, null, false, function () {
            setTimeout(function() {
                $(elementsToReplace).promise().done(function() {
                    $(elementsToReplace).collapse('show');
                });
            });
        }, false, 0);
        return false;
    }
</script>
