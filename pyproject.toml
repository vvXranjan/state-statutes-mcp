[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "state-statutes-mcp"
version = "0.1.0"
description = "MCP server for retrieving U.S. state statutes through state-specific adapters."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "mcp>=2.0",
    "pypdf>=4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
